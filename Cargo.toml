[package]
name = "diskscope"
version = "0.3.0"
edition = "2024"
# Edition 2024, let-chains and File::try_lock.
rust-version = "1.89"
description = "A responsive native Windows disk usage analyzer"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:raw-window-handle"]
diagnostics = []

[dependencies]
crossbeam-channel = "0.5.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"], optional = true }
egui_extras = { version = "0.34.3", optional = true }
rfd = { version = "0.15.4", optional = true }
# Names the HasWindowHandle trait so the main window can own Shell dialogs.
raw-window-handle = { version = "0.6.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry"] }
# Win32_System_Registry is needed by SHELLEXECUTEINFOW (its HKEY field) and by the
# read-only Recycle Bin policy lookups (RegGetValueW).
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.61.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
